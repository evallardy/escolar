; Configuración de Supervisor para mantener Gunicorn corriendo.
; Copiar a /etc/supervisor/conf.d/escolar.conf en el servidor y ajustar
; las rutas/usuario según tu instalación real.

[program:escolar]
directory=/var/www/escolar
command=/var/www/escolar/.venv/bin/gunicorn -c deploy/gunicorn.conf.py escolar.wsgi:application
user=escolar
group=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=false
stdout_logfile=/var/log/escolar/supervisor-stdout.log
stderr_logfile=/var/log/escolar/supervisor-stderr.log

; Antes de iniciar, asegúrate de que existan las carpetas de runtime/log:
;   sudo mkdir -p /var/www/escolar/run /var/log/escolar
;   sudo chown escolar:www-data /var/www/escolar/run /var/log/escolar
;
; Comandos útiles tras editar esta configuración:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status escolar
;   sudo supervisorctl restart escolar
