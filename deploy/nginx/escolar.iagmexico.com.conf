# Configuración de nginx para escolar.iagmexico.com
# Copiar a /etc/nginx/sites-available/escolar.iagmexico.com y crear el symlink:
#   sudo ln -s /etc/nginx/sites-available/escolar.iagmexico.com /etc/nginx/sites-enabled/
#
# Antes de tener el certificado, comenta el bloque server de 443 y el redirect
# de abajo, corre certbot en modo "solo nginx" y deja que él mismo edite este
# archivo (opción recomendada: `sudo certbot --nginx -d escolar.iagmexico.com`).

upstream escolar_app {
    server unix:/var/www/escolar/run/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name escolar.iagmexico.com;

    # Requerido por certbot para la validación HTTP-01.
    location /.well-known/acme-challenge/ {
        root /var/www/escolar/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name escolar.iagmexico.com;

    ssl_certificate     /etc/letsencrypt/live/escolar.iagmexico.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/escolar.iagmexico.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;  # Subida de trabajos/documentos de alumnos.

    access_log /var/log/nginx/escolar-access.log;
    error_log  /var/log/nginx/escolar-error.log;

    location /static/ {
        alias /var/www/escolar/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/escolar/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://escolar_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
