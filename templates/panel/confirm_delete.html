{% extends "base.html" %}
{% block title %}Eliminar {{ config.verbose_name }} · Panel Ejecutivo{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;">
  <div class="card-body">
    <h1 class="h5"><i class="bi bi-exclamation-triangle text-danger me-2"></i>Eliminar {{ config.verbose_name }}</h1>
    <p>¿Confirmas eliminar <strong>{{ instancia }}</strong>? Esta acción no se puede deshacer.</p>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Eliminar</button>
        <a href="{% url 'panel:listado' config.app_label config.model_name %}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
